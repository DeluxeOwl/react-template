# ----------------------------------------------------------------------------
# Rule 6: No object spread in variable assignments
# ----------------------------------------------------------------------------
# Example that MATCHES (bad):
#   const Foo = ({ baseStyles }) => {
#     const styles = { ...baseStyles, color: 'red' };  // <-- flagged
#     return <div style={styles}>Hello</div>;
#   };
# ----------------------------------------------------------------------------
id: no-object-spread-in-component
language: tsx
severity: error
rule:
  kind: lexical_declaration
  has:
    kind: spread_element
    stopBy: end
  inside:
    any:
      - kind: arrow_function
        has:
          kind: jsx_element
          stopBy: end
      - kind: arrow_function
        has:
          kind: jsx_self_closing_element
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_element
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_self_closing_element
          stopBy: end
    stopBy: end
message: "Avoid object spread in components. Move object composition to a custom hook."

---
# ----------------------------------------------------------------------------
# Rule 7: No ternary expressions in variable assignments
# ----------------------------------------------------------------------------
# Example that MATCHES (bad):
#   const Foo = ({ isAdmin }) => {
#     const role = isAdmin ? 'admin' : 'user';  // <-- flagged
#     return <div>{role}</div>;
#   };
# Note: Ternaries directly in JSX are OK: <div>{isAdmin ? 'Yes' : 'No'}</div>
# ----------------------------------------------------------------------------
id: no-ternary-assignment-in-component
language: tsx
severity: error
rule:
  kind: lexical_declaration
  has:
    kind: ternary_expression
    stopBy: end
  inside:
    any:
      - kind: arrow_function
        has:
          kind: jsx_element
          stopBy: end
      - kind: arrow_function
        has:
          kind: jsx_self_closing_element
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_element
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_self_closing_element
          stopBy: end
    stopBy: end
message: "Avoid ternary assignments in components. Move conditional logic to a custom hook."

---
# ----------------------------------------------------------------------------
# Rule 8: No multiple hooks in component
# ----------------------------------------------------------------------------
# Example that MATCHES (bad):
#   const Foo = () => {
#     const { users } = useUsers();  // <-- flagged (first of multiple)
#     const { theme } = useTheme();
#     return <div style={theme}>{users.length}</div>;
#   };
# ----------------------------------------------------------------------------
id: no-multiple-hooks-in-component
language: tsx
severity: error
rule:
  kind: lexical_declaration
  has:
    kind: call_expression
    regex: ^use[A-Z]
    stopBy: end
  precedes:
    kind: lexical_declaration
    has:
      kind: call_expression
      regex: ^use[A-Z]
      stopBy: end
    stopBy: end
  inside:
    any:
      - kind: arrow_function
        has:
          kind: jsx_element
          stopBy: end
      - kind: arrow_function
        has:
          kind: jsx_self_closing_element
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_element
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_self_closing_element
          stopBy: end
    stopBy: end
message: "Components should use at most one custom hook. Combine hooks into a single custom hook."

---
# ----------------------------------------------------------------------------
# Rule 9: No loops in components (for, for-in, for-of, while, do-while)
# ----------------------------------------------------------------------------
# Example that MATCHES (bad):
#   const Foo = ({ items }) => {
#     const results = [];
#     for (const item of items) {  // <-- flagged
#       results.push(item.name);
#     }
#     return <div>{results.join(', ')}</div>;
#   };
# ----------------------------------------------------------------------------
id: no-loops-in-component
language: tsx
severity: error
rule:
  any:
    - kind: for_statement
    - kind: for_in_statement
    - kind: while_statement
    - kind: do_statement
  inside:
    any:
      - kind: arrow_function
        has:
          kind: jsx_element
          stopBy: end
      - kind: arrow_function
        has:
          kind: jsx_self_closing_element
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_element
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_self_closing_element
          stopBy: end
    stopBy: end
message: "Avoid loops in components. Move iteration logic to a custom hook."

---
# ----------------------------------------------------------------------------
# Rule 10: No switch statements in components
# ----------------------------------------------------------------------------
# Example that MATCHES (bad):
#   const Foo = ({ status }) => {
#     let icon;
#     switch (status) {  // <-- flagged
#       case 'ok': icon = '✓'; break;
#       default: icon = '?';
#     }
#     return <div>{icon}</div>;
#   };
# ----------------------------------------------------------------------------
id: no-switch-in-component
language: tsx
severity: error
rule:
  kind: switch_statement
  inside:
    any:
      - kind: arrow_function
        has:
          kind: jsx_element
          stopBy: end
      - kind: arrow_function
        has:
          kind: jsx_self_closing_element
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_element
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_self_closing_element
          stopBy: end
    stopBy: end
message: "Avoid switch statements in components. Move branching logic to a custom hook."
