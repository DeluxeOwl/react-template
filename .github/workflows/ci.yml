name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The lint package's tests run vitest on real Node (oxlint's RuleTester
      # refuses Bun), and oxlint then loads the fixtures' oxlint.config.ts,
      # which needs Node >= 22.18. devbox.json has no Node, so pin it here
      # (devbox run keeps it on PATH).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Installs the devbox CLI + the Nix packages from devbox.json (bun,
      # lefthook, ...). Matches the local dev environment exactly.
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: true

      # NOTE: every `devbox run` re-executes the devbox init_hook, which runs
      # `bun install --frozen-lockfile`, `lefthook install`, and
      # `scripts/check-env-setup.sh`. That script skips its host-tool checks
      # when CI=true (set automatically by GitHub Actions).
      - name: install
        run: devbox run -- bun install --frozen-lockfile

      # packages/lint (@deluxeowl/lint) is a built (Model B) package whose
      # dist/ is gitignored. The root postinstall builds it, but with a warm
      # cache `bun install --frozen-lockfile` reports "no changes" and skips
      # postinstall, leaving dist/ absent. The oxlint config of every workspace,
      # the lint package's own included, imports @deluxeowl/lint/oxlint
      # (-> ./dist/oxlint/index.js), so build it before any step that uses one.
      - name: build lint package
        run: devbox run -- bun run --filter @deluxeowl/lint build

      - name: lint:oxlint
        run: devbox run -- bun run lint:oxlint

      # lint:oxlint applies fixes (oxlint-fix). A fix in CI means the pushed
      # code was not linted, so any change made by the fixers fails the job.
      - name: fixers changed nothing
        run: git diff --exit-code

      - name: lint:duplicate
        run: devbox run -- bun run lint:duplicate

      # dprint is a writer locally (format:dprint => `dprint fmt`); in CI we
      # only verify formatting is already applied.
      - name: format check
        run: devbox run -- bun run dprint check

      - name: typecheck
        run: devbox run -- bun run typecheck

      - name: deadcode
        run: devbox run -- bun run deadcode

      - name: test
        run: devbox run -- bun run test
