name: publish-lint
on:
  push:
    tags: ["lint-v*"] # e.g. git tag lint-v0.1.0 && git push --tags
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node >= 22.18 for the tests (see ci.yml), and the registry auth for npm publish.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"
          scope: "@deluxeowl"
      # bun and ast-grep (the tests run it) come from devbox.json, as in ci.yml.
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: true
      - run: devbox run -- bun install --frozen-lockfile
      - run: devbox run -- bun run --filter @deluxeowl/lint typecheck
      - run: devbox run -- bun run --filter @deluxeowl/lint test
      - run: devbox run -- bun run --filter @deluxeowl/lint build
      - run: cd packages/lint && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
