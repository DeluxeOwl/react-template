# ----------------------------------------------------------------------------
# Rule 10: No switch statements in components
# ----------------------------------------------------------------------------
# Example that MATCHES (bad - has nested JSX):
#   const Foo = ({ status }) => {
#     let icon;
#     switch (status) {  // <-- flagged
#       case 'ok': icon = '✓'; break;
#       default: icon = '?';
#     }
#     return <div><span>{icon}</span></div>;
#   };
#
# Example that does NOT match (simple wrapper - OK):
#   const Provider = ({ status }) => {
#     let icon;
#     switch (status) {  // <-- NOT flagged
#       case 'ok': icon = '✓'; break;
#       default: icon = '?';
#     }
#     return <Context.Provider value={icon}>{children}</Context.Provider>;
#   };
# ----------------------------------------------------------------------------
id: no-switch-in-component
language: tsx
severity: error
rule:
  kind: switch_statement
  inside:
    any:
      - kind: arrow_function
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
    stopBy: end
message: "Avoid switch statements in components. Move branching logic to a custom hook or prefer a dispatcher component if using JSX."
