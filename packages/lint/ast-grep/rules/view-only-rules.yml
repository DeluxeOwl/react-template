# ----------------------------------------------------------------------------
# Rule 9: No loops in components (for, for-in, for-of, while, do-while)
# ----------------------------------------------------------------------------
# Example that MATCHES (bad - has nested JSX):
#   const Foo = ({ items }) => {
#     const results = [];
#     for (const item of items) {  // <-- flagged
#       results.push(item.name);
#     }
#     return <div><span>{results.join(', ')}</span></div>;
#   };
#
# Example that does NOT match (simple wrapper - OK):
#   const Provider = ({ items }) => {
#     const results = [];
#     for (const item of items) {  // <-- NOT flagged
#       results.push(item.name);
#     }
#     return <Context.Provider value={results}>{children}</Context.Provider>;
#   };
# ----------------------------------------------------------------------------
id: no-loops-in-component
language: tsx
severity: error
rule:
  any:
    - kind: for_statement
    - kind: for_in_statement
    - kind: while_statement
    - kind: do_statement
  inside:
    any:
      - kind: arrow_function
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
    stopBy: end
message: "Avoid loops in components. Move iteration logic to a custom hook."

