# ----------------------------------------------------------------------------
# Rule 8: No multiple hooks in component (triggers at >= 3)
# ----------------------------------------------------------------------------
# Example that MATCHES (bad - has nested JSX):
#   const Foo = () => {
#     const { users } = useUsers();
#     const { theme } = useTheme();
#     const { foo } = useSomething(); // <-- flagged (first of multiple)
#     return <div style={theme}><span>{users.length}</span></div>;
#   };
#
# Example that does NOT match (simple wrapper - OK):
#   const Provider = () => {
#     const { users } = useUsers();  // <-- NOT flagged
#     const { theme } = useTheme();
#     return <Context.Provider value={{ users, theme }}>{children}</Context.Provider>;
#   };
# ----------------------------------------------------------------------------
id: no-multiple-hooks-in-component
language: tsx
severity: error
rule:
  kind: lexical_declaration
  has:
    kind: call_expression
    regex: ^use[A-Z]
    stopBy: end
  precedes:
    kind: lexical_declaration
    has:
      kind: call_expression
      regex: ^use[A-Z]
      stopBy: end
      precedes: # Add this block for the 3rd hook
        kind: lexical_declaration
        has:
          kind: call_expression
          regex: ^use[A-Z]
          stopBy: end
    stopBy: end
  inside:
    any:
      - kind: arrow_function
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
    stopBy: end
message: "Components should use at most one custom hook. Combine hooks into a single custom hook."

