# ----------------------------------------------------------------------------
# Rule 3: No .filter() calls in components
# ----------------------------------------------------------------------------
# Example that MATCHES (bad - has nested JSX):
#   const Foo = () => {
#     const { users } = useUsers();
#     const active = users.filter(u => u.active);  // <-- flagged
#     return <div><span>{active.length}</span></div>;
#   };
#
# Example that does NOT match (simple wrapper - OK):
#   const Provider = () => {
#     const active = users.filter(u => u.active);  // <-- NOT flagged
#     return <Context.Provider value={active}>{children}</Context.Provider>;
#   };
# ----------------------------------------------------------------------------
id: no-filter-in-component
language: tsx
severity: error
rule:
  pattern: $ARR.filter($$$)
  inside:
    any:
      - kind: arrow_function
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
    stopBy: end
message: "Avoid .filter() in components. Move filtering logic to a custom hook."

