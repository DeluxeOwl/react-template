# ----------------------------------------------------------------------------
# Rule 6: No object spread in variable assignments
# ----------------------------------------------------------------------------
# Example that MATCHES (bad - has nested JSX):
#   const Foo = ({ baseStyles }) => {
#     const styles = { ...baseStyles, color: 'red' };  // <-- flagged
#     return <div style={styles}><span>Hello</span></div>;
#   };
#
# Example that does NOT match (simple wrapper - OK):
#   const Provider = ({ baseStyles }) => {
#     const styles = { ...baseStyles, color: 'red' };  // <-- NOT flagged
#     return <Context.Provider value={styles}>{children}</Context.Provider>;
#   };
# ----------------------------------------------------------------------------
id: no-object-spread-in-component
language: tsx
severity: error
rule:
  kind: lexical_declaration
  has:
    kind: spread_element
    stopBy: end
  inside:
    any:
      - kind: arrow_function
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
    stopBy: end
message: "Avoid object spread in components. Move object composition to a custom hook."

