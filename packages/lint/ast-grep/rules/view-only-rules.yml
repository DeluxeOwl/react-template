# ----------------------------------------------------------------------------
# Rule 7: No ternary expressions in variable assignments
# ----------------------------------------------------------------------------
# Example that MATCHES (bad - has nested JSX):
#   const Foo = ({ isAdmin }) => {
#     const role = isAdmin ? 'admin' : 'user';  // <-- flagged
#     return <div><span>{role}</span></div>;
#   };
#
# Example that does NOT match (simple wrapper - OK):
#   const Provider = ({ isAdmin }) => {
#     const role = isAdmin ? 'admin' : 'user';  // <-- NOT flagged
#     return <Context.Provider value={role}>{children}</Context.Provider>;
#   };
#
# Note: Ternaries directly in JSX are OK: <div>{isAdmin ? 'Yes' : 'No'}</div>
# ----------------------------------------------------------------------------
id: no-ternary-assignment-in-component
language: tsx
severity: error
rule:
  kind: lexical_declaration
  has:
    kind: ternary_expression
    stopBy: end
  inside:
    any:
      - kind: arrow_function
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
    stopBy: end
message: "Avoid ternary assignments in components. Move conditional logic to a custom hook."

