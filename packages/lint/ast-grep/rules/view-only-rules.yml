# ----------------------------------------------------------------------------
# Rule 5: No arithmetic/binary expressions in variable assignments
# ----------------------------------------------------------------------------
# Example that MATCHES (bad - has nested JSX):
#   const Foo = ({ count }) => {
#     const doubled = count * 2;  // <-- flagged
#     return <div><span>{doubled}</span></div>;
#   };
#
# Example that does NOT match (simple wrapper - OK):
#   const Provider = ({ count }) => {
#     const doubled = count * 2;  // <-- NOT flagged
#     return <Context.Provider value={doubled}>{children}</Context.Provider>;
#   };
# ----------------------------------------------------------------------------
id: no-logic-expressions-in-component
language: tsx
severity: error
rule:
  kind: lexical_declaration
  has:
    kind: binary_expression
    stopBy: end
  not:
    has:
      kind: call_expression
      stopBy: end
  inside:
    any:
      - kind: arrow_function
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
    stopBy: end
message: "Avoid logic expressions in components. Move calculations to a custom hook."

