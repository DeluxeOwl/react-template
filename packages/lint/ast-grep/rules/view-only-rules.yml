# ----------------------------------------------------------------------------
# Rule 2: No logic inside .map() callbacks in JSX
# ----------------------------------------------------------------------------
# This rule allows .map() in JSX but forbids logic inside the callback.
# Simple maps and early returns are OK; variable declarations are NOT.
#
# Example that MATCHES (bad - has logic inside map):
#   const Foo = () => (
#     <ul>
#       {items.map((item) => {
#         const name = item.name.toUpperCase();  // <-- flagged (logic!)
#         return <li>{name}</li>;
#       })}
#     </ul>
#   );
#
# Example that does NOT match (simple expression - OK):
#   const Foo = () => (
#     <ul>
#       {items.map((item) => <li key={item.id}>{item.name}</li>)}
#     </ul>
#   );
#
# Example that does NOT match (early return only - OK):
#   const Foo = () => (
#     <ul>
#       {items.map((item) => {
#         if (!item.isActive) return null;  // Early return is OK
#         return <li key={item.id}>{item.name}</li>;
#       })}
#     </ul>
#   );
# ----------------------------------------------------------------------------
id: no-logic-in-map-callback
language: tsx
severity: error
rule:
  pattern: $ARR.map($$$)
  has:
    kind: arrow_function
    has:
      kind: statement_block
      has:
        kind: lexical_declaration
        stopBy: end
      stopBy: end
    stopBy: end
  inside:
    kind: jsx_element
    stopBy: end
message: |
  Avoid logic inside .map() callbacks. Only early returns are allowed.
  Move data transformations to a custom hook or compute them before the map.

