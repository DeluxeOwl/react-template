# ----------------------------------------------------------------------------
# Rule 4: No array transformation methods in components
# ----------------------------------------------------------------------------
# Example that MATCHES (bad - has nested JSX):
#   const Foo = () => {
#     const { users } = useUsers();
#     const total = users.reduce((a, u) => a + u.age, 0);  // <-- flagged
#     return <div><span>{total}</span></div>;
#   };
#
# Example that does NOT match (simple wrapper - OK):
#   const Provider = () => {
#     const total = users.reduce((a, u) => a + u.age, 0);  // <-- NOT flagged
#     return <Context.Provider value={total}>{children}</Context.Provider>;
#   };
# ----------------------------------------------------------------------------
id: no-array-methods-in-component
language: tsx
severity: error
rule:
  any:
    - pattern: $ARR.reduce($$$)
    - pattern: $ARR.find($$$)
    - pattern: $ARR.findIndex($$$)
    - pattern: $ARR.some($$$)
    - pattern: $ARR.every($$$)
    - pattern: $ARR.flatMap($$$)
    - pattern: $ARR.sort($$$)
    - pattern: $ARR.slice($$$)
    - pattern: $ARR.concat($$$)
    - pattern: $ARR.includes($$$)
    - pattern: $ARR.toSorted($$$)
    - pattern: $ARR.toReversed()
    - pattern: $ARR.toSpliced($$$)
    - pattern: $ARR.with($$$)
    - pattern: $ARR.findLast($$$)
    - pattern: $ARR.findLastIndex($$$)
    - pattern: $ARR.at($$$)
    - pattern: $ARR.flat($$$)
    - pattern: Object.groupBy($ARR, $$$)
  inside:
    any:
      - kind: arrow_function
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
      - kind: function_declaration
        has:
          kind: jsx_element
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
            stopBy: end
          stopBy: end
    stopBy: end
message: "Avoid array methods in components. Move data transformations to a custom hook."

