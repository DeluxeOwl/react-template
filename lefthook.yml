commit-msg:
  commands:
    "lint commit message":
      use_stdin: true
      run: cat {1} | commitlint

pre-push:
  commands:
    00-check-if-devbox:
      run: bash -c scripts/check-if-in-devbox.sh
  parallel: true
  jobs:
    - name: lint/oxlint
      run: bun run lint:oxlint
    - name: format/dprint
      run: bun run format:dprint
    - name: lint/duplicate-code
      run: bun run lint:duplicate
    - name: typecheck
      run: bun run typecheck
    - name: deadcode
      run: bun run deadcode
